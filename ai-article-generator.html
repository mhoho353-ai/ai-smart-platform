<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد المقالات والمدونات الذكي - منصة الذكاء الاصطناعي</title>
    <meta name="description" content="أنشئ مقالات حصرية متوافقة مع السيو (SEO) بالذكاء الاصطناعي أونلاين مجاناً مدعومة بمفتاح API الخاص بك.">
    
    <!-- بيانات السيو المهيكلة (Schema Markup) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "مولد المقالات والمدونات الذكي",
      "operatingSystem": "All",
      "applicationCategory": "DeveloperApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "أداة ذكية لتوليد مقالات كاملة متوافقة مع محركات البحث."
    }
    </script>

    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-indigo-400 text-xs font-bold hover:underline">⬅ العودة للمنصة</a>
            <h1 class="text-xl font-bold text-indigo-400">مولد المقالات الذكي ✍️</h1>
            <span></span>
        </div>
        <p class="text-sm text-slate-400 mt-1">أنشئ مقالات متوافقة مع السيو بالذكاء الاصطناعي فوراً</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-2xl mx-auto p-4 sm:p-6 w-full flex-grow space-y-6">
        
        <!-- إعدادات الـ API -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2">
            <label class="block text-xs font-bold text-indigo-300">مفتاح Google Gemini API Key:</label>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح الـ API هنا..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none">
                <button onclick="saveApiKey()" class="bg-indigo-600 text-white font-bold px-3 py-2 rounded-xl hover:bg-indigo-500 text-xs">حفظ</button>
            </div>
        </div>

        <!-- صندوق الأداة الرئيسي -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-lg p-5 sm:p-6 space-y-4">
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">عنوان المقال أو الكلمة المستهدفة:</label>
                <input type="text" id="articleTopic" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm text-slate-100" placeholder="مثال: فوائد الرياضة الصباحية لصحة الجسم">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">لغة المقال:</label>
                    <select id="articleLang" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none">
                        <option value="ar">اللغة العربية الفصحى</option>
                        <option value="en">اللغة الإنجليزية</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="generateArticle()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-500 transition text-sm shadow-md">
                        توليد المقال بالكامل 🚀
                    </button>
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-300">المقال الناتج:</label>
                    <button onclick="copyOutput()" class="bg-indigo-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg hover:bg-indigo-500 transition">
                        نسخ المقال 📋
                    </button>
                </div>
                <textarea id="outputText" rows="10" readonly class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none text-slate-200 leading-relaxed" placeholder="سيظهر المقال كاملاً ومنسقاً هنا..."></textarea>
            </div>

        </div>

    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        تُولد المقالات عبر الـ API خصيصاً لتناسب محركات البحث.
    </footer>

    <!-- سكريبت التوليد -->
    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('الرجاء إدخال مفتاح صحيح!');
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            alert('تم حفظ المفتاح بنجاح!');
        }

        async function generateArticle() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const topic = document.getElementById('articleTopic').value.trim();
            const lang = document.getElementById('articleLang').value;
            const outputText = document.getElementById('outputText');

            if (!apiKey) {
                alert('الرجاء حفظ مفتاح الـ API أولاً!');
                return;
            }
            if (!topic) {
                alert('الرجاء إدخال عنوان أو موضوع المقال!');
                return;
            }

            outputText.value = "جاري كتابة المقال وتنسيقه بواسطة الذكاء الاصطناعي... قد يستغرق ثوانٍ معدودة ⏳";

            let promptText = lang === 'ar' 
                ? `اكتب مقالاً كاملاً، احترافياً، ومتوافقاً مع السيو (SEO) حول الموضوع التالي: "${topic}". اجعل المقال مقسماً إلى مقدمة، عناوين فرعية (H2/H3)، وفقرات توضيحية غنية بالمعلومات، وخاتمة.`
                : `Write a complete, professional, and SEO-optimized article about the following topic: "${topic}". Include an introduction, subheadings, informative paragraphs, and a conclusion.`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const requestBody = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    outputText.value = data.candidates[0].content.parts[0].text;
                } else {
                    let errorMsg = data.error ? data.error.message : 'خطأ غير معروف';
                    outputText.value = `فشل التوليد: ${errorMsg}`;
                }
            } catch (error) {
                outputText.value = `حدث خطأ في الشبكة: ${error.message}`;
            }
        }

        function copyOutput() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) return;
            navigator.clipboard.writeText(outputText.value);
            alert('تم نسخ المقال بنجاح!');
        }
    </script>
</body>
</html>
